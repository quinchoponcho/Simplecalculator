name: CI
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      # 1. Install all necessary system dependencies for Kivy/Buildozer
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            git \
            libffi-dev \
            libssl-dev \
            libgtk-3-dev \
            python3-dev \
            python3-pip \
            python3-setuptools \
            python3-virtualenv \
            zip \
            unzip \
            openjdk-17-jdk \
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3          
        
      - name: Install System Dependencies & AIDL
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libstdc++6 aidl
      - name: Accept Android SDK Licenses
        run: |
          # Create the local buildozer target directory to pre-initialize the SDK path
          mkdir -p ./.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin
          
          # Automatically accept all licenses using the system's built-in Android SDK
          yes | sdkmanager --licenses  || true
          
          # Pass the accepted licenses into Buildozer's custom SDK target directory
          if [ -d "$ANDROID_HOME/licenses" ]; then
            mkdir -p ./.buildozer/android/platform/android-sdk/licenses
            cp -r $ANDROID_HOME/licenses/* ./.buildozer/android/platform/android-sdk/licenses/
          fi    
      # 2. Setup Java Environment (Buildozer requires a specific Java path)
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Install Buildozer and Cython
      - name: Install Buildozer and dependencies
        run: |
          pip3 install --upgrade pip
          pip3 install --upgrade Cython==0.29.36 buildozer virtualenv

      # 4. Run the Buildozer compilation
      - name: Build with Buildozer
        run: |
          buildozer android debug

      # 5. Upload the generated APK so you can download it
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: ./.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/dists/*/*.apk
